# Vhost nginx de staging: staging.ceibo.example.com
#
# Dónde va en la box: /etc/nginx/sites-available/ceibo-staging
# Activar: sudo ln -s /etc/nginx/sites-available/ceibo-staging /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
# Arquitectura de ingress (modelo real de vps.example.com, confirmado con Shelley 2026-06-16):
#   vps.example.com termina TLS afuera y proxea TODOS los dominios custom de la VM al MISMO
#   "share port" (acá :8000). NO hay puerto por-host en el edge. El dominio se registra
#   con `ssh vps.example.com domain add ceibo-prod staging.ceibo.example.com` (saca el 421).
#   ⇒ El split entre prod y staging se hace ACÁ, en el nginx local, por `server_name`
#   (Host header): este bloque escucha en el MISMO :8000 que prod (managed-2, que es
#   `server_name _` catch-all) y gana para `staging.ceibo.example.com`; el resto cae a prod.
#
# Dónde va en la box: /etc/nginx/sites-available/ceibo-staging (sites-enabled symlink).
# Coexiste con managed-2 (prod) en :8000 — nginx rutea por server_name.
#
# ⚠️⚠️ ANTES DE RECARGAR NGINX — requisito que rompió prod una vez (2026-06-16):
#   prod (managed-2) usa `server_name _`, que NO matchea un Host real → prod dependía de
#   ser el DEFAULT server de :8000. Al agregar ESTE bloque, como `ceibo-staging` carga
#   ANTES que `managed-2` (orden alfabético de sites-enabled) y ninguno era default, staging
#   se volvió el default → TODO el tráfico de prod (ceibo.example.com) cayó en staging (500).
#   FIX OBLIGATORIO: marcar prod como default explícito ANTES del reload:
#     sudo sed -i 's|listen 127.0.0.1:8000;|listen 127.0.0.1:8000 default_server;|' \
#       /etc/nginx/sites-enabled/managed-2
#   OJO: /etc/nginx/sites-enabled/managed-2 es un ARCHIVO REGULAR (no symlink a
#   sites-available) → editá ESE. Verificá: `nginx -T | grep -n default_server` debe
#   mostrar el listen de managed-2. Este bloque (ceibo-staging) NUNCA debe ser default_server.
#
# Topología de puertos de staging (convive con prod en la misma box):
#   ingress (compartido):  8000  (este server_name + el `_` de prod)
#   web-server:            8821  (prod 8820 — derivado por ceiboEnv())
#   mcps:                  8811  (prod 8810 — PORT override en ceibo-mcps@.service)
#   oauth servicio:        8002  (prod 8801 — PORT en .env.staging)
#   gateway control-mcp:   8831  (prod 8830 — CONTROL_MCP_PORT en ceibo-gateway@.service)
#
# Precedente: /etc/nginx/sites-available/managed-2 (vhost de prod, `server_name _` en :8000).

server {
    listen 127.0.0.1:8000;
    server_name staging.ceibo.example.com;

    location = /healthz {
        default_type text/plain;
        return 200 "ok-staging\n";
    }

    # Servicio oauth de staging en :8002 (prod :8801). El ingress es el :8000 compartido.
    location /oauth/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # viewer MCP: servido por el gateway staging in-process. NO strippea el path.
    location /mcp/viewer/ {
        access_log off;
        proxy_pass http://127.0.0.1:8821;
        proxy_set_header Host $host;
    }

    # control MCP: servido por el gateway staging in-process. NO strippea el path.
    location /mcp/control/ {
        access_log off;
        proxy_pass http://127.0.0.1:8831;
        proxy_set_header Host $host;
    }

    # MCPs stateless: strippea /mcp/ (el launcher recibe /<server>/<secret>).
    location /mcp/ {
        access_log off;
        proxy_pass http://127.0.0.1:8811/;
        proxy_set_header Host $host;
    }

    # UI web: API + SSE + SPA. web-server de staging en 8821.
    # /api/stream es SSE long-lived → buffering off + read_timeout alto.
    location /api/ {
        proxy_pass http://127.0.0.1:8821;
        client_max_body_size 26m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8821;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
