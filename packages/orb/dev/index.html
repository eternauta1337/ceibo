<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orbe · sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1410; }
      /* Fondo del sandbox: en la app real acá va una foto (Unsplash). En el repo dejamos un
         degradado para no versionar imágenes de terceros. */
      #bg { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 40%, #1d3326 0%, #0d1410 70%); }
      #orb-bg {
        position: fixed; top: 50%; left: 50%; width: 80vmin; height: 80vmin;
        transform: translate(-50%, -50%); pointer-events: none;
      }
      #orb {
        position: fixed; top: 50%; left: 50%; width: 80vmin; height: 80vmin;
        transform: translate(-50%, -50%); pointer-events: none;
      }
      #drive {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 9;
        display: flex; gap: 14px; align-items: center; background: rgba(16, 16, 20, 0.85);
        color: #e8e6f0; font: 12px ui-monospace, monospace; padding: 8px 14px; border-radius: 9px;
      }
      #drive input[type="range"] { vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <canvas id="orb-bg" aria-hidden="true"></canvas>
    <canvas id="orb" aria-label="orbe"></canvas>
    <div id="drive">
      <label>nivel <input id="lvl" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label><input id="mic" type="checkbox" /> mic real</label>
      <span style="opacity:0.6">subs:</span>
      <span id="sat-btns" style="display:flex;gap:4px"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
